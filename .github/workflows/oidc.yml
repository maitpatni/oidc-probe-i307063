name: oidc
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: probe
        run: |
          set -uo pipefail
          RESP=$(curl -sS -m 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://jwt-exchange")
          TOK=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKLEN=${#TOK}"
          printf '%s' "$TOK" | cut -d. -f2 | python3 -c 'import sys,base64,json;s=sys.stdin.read().strip();s+="="*(-len(s)%4);print("CLAIMS="+json.dumps(json.loads(base64.urlsafe_b64decode(s)),sort_keys=True))'
          for T in synkube/lite-argo-apps synkube/actions synkube/charts synkube/jwt-exchange synkube/app synkube/website synapsecns/sanguine synapsecns/synapse-contracts; do
            BODY="{\"subject_token\":\"$TOK\",\"resource\":{\"type\":\"github_repository\",\"id\":\"$T\"},\"requested\":{\"github_permissions\":{\"contents\":\"read\"}},\"exchange_profile\":\"github_actions_to_installation\"}"
            OUT=$(curl -sS -m 30 -w '|HTTP=%{http_code}' -X POST https://jwt-exchange.synkube.com/api/v2/exchange/token -H 'Content-Type: application/json' -d "$BODY")
            echo "EXCH $T => $(printf '%s' "$OUT" | tr '\n' ' ' | head -c 700)"
          done
